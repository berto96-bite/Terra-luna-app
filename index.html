<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#000010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terra-Luna">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23000'/><circle cx='50' cy='50' r='20' fill='%234488ff'/><circle cx='70' cy='30' r='8' fill='%23cccccc'/></svg>">
  <title>🌍 Terra-Luna 2025</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #000008;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y pinch-zoom;
    }
    #info {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      color: #fff;
      background: rgba(6, 6, 22, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,170,0,0.3);
      z-index: 10;
    }
    #info h1 { font-size: 1.3rem; font-weight: 650; background: linear-gradient(135deg, #fff, #fb7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    #info p { font-size: 0.75rem; opacity: 0.85; color: #ccd; margin-top: 2px; }
    
    .eclipse-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 18px 30px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      pointer-events: none;
      z-index: 30;
      letter-spacing: 0.6px;
      box-shadow: 0 0 60px rgba(255,100,30,0.9);
      border: 2px solid rgba(255,180,80,0.7);
      display: none;
      text-align: center;
      animation: eclipseGlow 2s ease-in-out infinite;
    }
    @keyframes eclipseGlow {
      0%,100% { box-shadow: 0 0 40px rgba(255,140,30,0.8); }
      50% { box-shadow: 0 0 80px rgba(255,80,20,1), 0 0 120px rgba(255,40,10,0.7); }
    }
    
    .controls-container {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,26,0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 40px;
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      z-index: 20;
      width: 92%;
      max-width: 420px;
    }
    .slider-group { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #ddd; }
    .slider-group label { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
    input[type=range] {
      width: 100%;
      cursor: pointer;
      background: rgba(255,255,255,0.14);
      height: 8px;
      border-radius: 8px;
      appearance: none;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffdd88, #ff8800);
      box-shadow: 0 0 30px #fa0, 0 0 12px #f70, 0 0 0 3px #fff;
      border: none;
    }
    .day-row { display: flex; justify-content: space-between; width: 100%; font-weight: 600; font-size: 0.85rem; gap: 8px; flex-wrap: wrap; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .day-badge { background: rgba(255,255,255,0.12); color: #fff; }
    .season-badge { background: rgba(255,170,0,0.2); color: #fc8; }
    .phase-text { font-size: 0.82rem; color: #ddd; text-align: center; background: rgba(255,255,255,0.06); padding: 5px; border-radius: 20px; }
    .rot-text { font-size: 0.8rem; color: #fd8; text-align: center; font-weight: 700; background: rgba(255,170,0,0.2); padding: 6px 12px; border-radius: 24px; }
    .eclipse-badge { display: none; font-size: 0.8rem; text-align: center; font-weight: 700; padding: 6px 14px; border-radius: 24px; animation: pulseBadge 1.6s ease-in-out infinite; }
    @keyframes pulseBadge {
      0%,100% { box-shadow: 0 0 20px rgba(255,90,30,0.7); }
      50% { box-shadow: 0 0 40px rgba(255,70,20,1), 0 0 55px rgba(255,40,10,0.9); }
    }
    .hint { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 0.7rem; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 5px 14px; border-radius: 20px; pointer-events: none; z-index: 15; }
    @media (min-width: 768px) {
      #info h1 { font-size: 1.7rem; }
      #info p { font-size: 0.85rem; }
      .controls-container { padding: 18px 32px; border-radius: 48px; }
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>🌍 Sistema Terra-Luna</h1>
    <p>2025 · 4 eclissi reali · Orbita 5.14°</p>
  </div>
  <div class="eclipse-overlay" id="eclipse-overlay"></div>
  <div class="hint">🖱️ Trascina · Scroll zoom · Cursore giorni</div>

  <div class="controls-container">
    <div class="slider-group">
      <label>📅 Giorno dell'anno <span style="font-size:0.7rem;opacity:0.7;">(1–365)</span></label>
      <input type="range" id="day-slider" min="1" max="365" value="73" step="0.1">
      <div class="day-row">
        <span class="badge day-badge" id="day-display">G 73.0</span>
        <span class="badge season-badge" id="season-display">❄️ Inverno</span>
      </div>
      <div class="phase-text" id="moon-phase-display">🌑 Luna nuova</div>
      <div class="rot-text" id="rotation-indicator">🔄 73.0 / 365 giri</div>
      <div class="eclipse-badge" id="eclipse-indicator"></div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.126.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const DAYS = 365, ROT = 365, SID = 27.322, SYN = 29.53, INC = 5.14*(Math.PI/180);
    const ECL = [{d:73,t:'lunar',x:'🌕 Eclissi Lunare Totale'},{d:88,t:'solar',x:'☀️ Eclissi Solare Parziale'},{d:250,t:'lunar',x:'🌕 Eclissi Lunare Totale'},{d:264,t:'solar',x:'☀️ Eclissi Solare Parziale'}];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010116);
    scene.fog = new THREE.FogExp2(0x010116, 0.000012);

    const cam = new THREE.PerspectiveCamera(43, innerWidth/innerHeight, 0.1, 500);
    cam.position.set(6.8,5.2,9.2); cam.lookAt(0,0,0);

    const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    const lr = new CSS2DRenderer();
    lr.setSize(innerWidth,innerHeight);
    lr.domElement.style.position = 'absolute';
    lr.domElement.style.top = '0';
    lr.domElement.style.left = '0';
    lr.domElement.style.pointerEvents = 'none';
    document.body.appendChild(lr.domElement);

    const ctrl = new OrbitControls(cam, renderer.domElement);
    ctrl.enableDamping = true;
    ctrl.dampingFactor = 0.08;
    ctrl.rotateSpeed = 0.8;
    ctrl.zoomSpeed = 2;
    ctrl.target.set(0,0,0);
    ctrl.update();
    ctrl.maxDistance = 65;
    ctrl.minDistance = 2.5;
    ctrl.maxPolarAngle = Math.PI;

    scene.add(new THREE.AmbientLight(0x0a0a2a,0.45));
    scene.add(new THREE.HemisphereLight(0x443366,0x0a0a1a,0.5));
    const sl = new THREE.PointLight(0xfff8ee,3.2,0,0);
    sl.position.set(0,0,0);
    sl.castShadow = true;
    sl.shadow.mapSize.width = 2048;
    sl.shadow.mapSize.height = 2048;
    sl.shadow.bias = -0.00003;
    sl.shadow.camera.near = 0.1;
    sl.shadow.camera.far = 75;
    scene.add(sl);
    scene.add(new THREE.PointLight(0xffeedd,0.9,26));

    const sGeo = new THREE.BufferGeometry();
    const sCnt = 3000, p = new Float32Array(sCnt*3), c = new Float32Array(sCnt*3);
    for(let i=0;i<sCnt*3;i+=3){
      const r=55+Math.random()*110, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
      p[i]=Math.cos(th)*Math.sin(ph)*r; p[i+1]=Math.sin(th)*Math.sin(ph)*r*.55; p[i+2]=Math.cos(ph)*r;
      const rc=Math.random();
      if(rc<.12){c[i]=.5;c[i+1]=.65;c[i+2]=1}else if(rc<.22){c[i]=1;c[i+1]=.65;c[i+2]=.45}else{const b=.55+Math.random()*.45;c[i]=b;c[i+1]=b;c[i+2]=b}
    }
    sGeo.setAttribute('position',new THREE.BufferAttribute(p,3));
    sGeo.setAttribute('color',new THREE.BufferAttribute(c,3));
    const stars = new THREE.Points(sGeo,new THREE.PointsMaterial({size:.28,blending:THREE.AdditiveBlending,vertexColors:true,transparent:true,opacity:.9,depthWrite:false}));
    scene.add(stars);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(.9,76,76),new THREE.MeshStandardMaterial({color:0xffeebb,emissive:new THREE.Color(0xff5500),roughness:.16,emissiveIntensity:1.9}));
    scene.add(sun);
    const sg1=new THREE.Mesh(new THREE.SphereGeometry(1.04,48,48),new THREE.MeshBasicMaterial({color:0xff7700,transparent:true,opacity:.17,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(sg1);
    const sg2=new THREE.Mesh(new THREE.SphereGeometry(1.28,48,48),new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:.07,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(sg2);

    const eOrb = new THREE.Group(); scene.add(eOrb);
    const tex = new THREE.TextureLoader();
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1.2,100,100),new THREE.MeshStandardMaterial({map:tex.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),roughness:.55,metalness:.04,normalMap:tex.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),normalScale:new THREE.Vector2(.8,.8)}));
    earth.castShadow = true; earth.receiveShadow = true; eOrb.add(earth);
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.23,100,100),new THREE.MeshStandardMaterial({map:tex.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false,roughness:.85}));
    earth.add(clouds);
    const el = new CSS2DObject(Object.assign(document.createElement('div'),{textContent:'🌍 Terra',style:'color:white;font-weight:700;font-size:16px;text-shadow:1px 1px 4px black;'}));
    el.position.set(0,1.6,0); earth.add(el);

    const mPlane = new THREE.Group(); mPlane.rotation.x = INC; eOrb.add(mPlane);
    const mPivot = new THREE.Group(); mPlane.add(mPivot);
    const mDist = 3.0;
    const moon = new THREE.Mesh(new THREE.SphereGeometry(.36,76,76),new THREE.MeshStandardMaterial({map:tex.load('https://threejs.org/examples/textures/planets/moon_1024.jpg'),roughness:.75,metalness:.02}));
    moon.castShadow = true; moon.receiveShadow = true; moon.position.set(mDist,0,0); mPivot.add(moon);
    const ml = new CSS2DObject(Object.assign(document.createElement('div'),{textContent:'🌙 Luna',style:'color:#eee;font-weight:600;font-size:13px;text-shadow:1px 1px 3px black;'}));
    ml.position.set(0,.54,0); moon.add(ml);

    mPlane.add(new THREE.Mesh(new THREE.TorusGeometry(mDist,.01,16,300),new THREE.MeshStandardMaterial({color:0x8899cc,emissive:new THREE.Color(0x112233),roughness:.5,transparent:true,opacity:.38})));
    const eDist = 6.0;
    scene.add(new THREE.Mesh(new THREE.TorusGeometry(eDist,.02,16,400),new THREE.MeshStandardMaterial({color:0x5588cc,emissive:new THREE.Color(0x001122),roughness:.5,transparent:true,opacity:.4})));
    mPlane.add(new THREE.Line(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([-10,0,0,10,0,0],3)),new THREE.LineBasicMaterial({color:0xff5555,transparent:true,opacity:.22})));

    const slider = document.getElementById('day-slider');
    const dayD = document.getElementById('day-display');
    const seaD = document.getElementById('season-display');
    const phaD = document.getElementById('moon-phase-display');
    const rotD = document.getElementById('rotation-indicator');
    const overlay = document.getElementById('eclipse-overlay');
    const eclB = document.getElementById('eclipse-indicator');

    function sea(d){if(d>=80&&d<=172)return'🌱 Primavera';if(d>=173&&d<=265)return'☀️ Estate';if(d>=266&&d<=355)return'🍂 Autunno';return'❄️ Inverno';}
    function pha(d){const p=d%SYN;if(p<1.8)return'🌑 Luna nuova';if(p<7.2)return'🌒 Luna crescente';if(p<9.2)return'🌓 Primo quarto';if(p<14.6)return'🌔 Gibbosa crescente';if(p<16.3)return'🌕 Luna piena';if(p<22.1)return'🌖 Gibbosa calante';if(p<24.4)return'🌗 Ultimo quarto';return'🌘 Luna calante';}
    function ecl(d){for(const e of ECL)if(Math.abs(d-e.d)<1.2)return e;return null;}

    function upd(d){
      const a=((d-1)/DAYS)*Math.PI*2;
      eOrb.position.set(Math.cos(a)*eDist,0,Math.sin(a)*eDist);
      mPivot.rotation.y=((d-1)/SID)*Math.PI*2;
      const rot=(d-1)*(ROT/(ROT-1));
      earth.rotation.y=rot*Math.PI*2;
      clouds.rotation.y=rot*Math.PI*2*1.028;
      moon.rotation.y=mPivot.rotation.y*.985;
      dayD.textContent=`G ${d.toFixed(1)}`;
      seaD.textContent=sea(Math.round(d));
      phaD.textContent=pha(d);
      rotD.textContent=`🔄 ${rot.toFixed(1)} / 365 giri`;
      const ec=ecl(d);
      if(ec){
        overlay.style.display='block'; eclB.style.display='block'; overlay.textContent=ec.x;
        if(ec.t==='solar'){overlay.style.background='rgba(255,160,30,0.9)';eclB.style.background='rgba(255,160,30,0.9)';eclB.textContent='☀️🌑 Solare';}
        else{overlay.style.background='rgba(170,40,40,0.9)';eclB.style.background='rgba(170,40,40,0.9)';eclB.textContent='🌕🌑 Lunare';}
      }else{overlay.style.display='none';eclB.style.display='none';}
    }

    slider.addEventListener('input',e=>upd(parseFloat(e.target.value)));
    slider.addEventListener('wheel',e=>{e.preventDefault();const v=parseFloat(slider.value)+(e.deltaY>0?-.3:.3);slider.value=Math.max(1,Math.min(365,v));upd(parseFloat(slider.value));},{passive:false});

    upd(73);

    function anim(){
      requestAnimationFrame(anim);
      stars.rotation.y+=.00004; stars.rotation.x+=.00002;
      sun.rotation.y+=.0022; sg1.rotation.y+=.0011; sg2.rotation.y+=.0007;
      ctrl.update();
      renderer.render(scene,cam);
      lr.render(scene,cam);
    }
    anim();

    addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);});

    // Registra Service Worker
    if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
  </script>
</body>
</html>
